[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quhi"
version = "0.1.0"
description = "Simulate QUBO/HUBO formulations of urban-heat-island planning with classical, quantum-inspired and quantum solvers"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "numba>=0.57", "matplotlib>=3.7", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
dwave = ["dimod>=0.12", "dwave-neal>=0.6"]

[tool.setuptools.packages.find]
include = ["quhi*"]
